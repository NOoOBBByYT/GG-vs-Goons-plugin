name: GGvGoons
version: '${version}'
main: com.tyler.ggvsgoons.GGvGPlugin
api-version: '1.21'
author: Tyler

commands:
  warprisoner:
    description: Take a player as a war prisoner
    usage: /<command> <player>
    permission: ggvgoons.warprisoner.capture
  warprisoneraccept:
    description: Accept a war prisoner offer (internal)
    usage: /<command> <captorId>
  warprisonerdecline:
    description: Decline a war prisoner offer (internal)
    usage: /<command> <captorId>
  freeprisoner:
    description: Release your war prisoner
    usage: /<command> <player>
    permission: ggvgoons.warprisoner.free
  executeprisoner:
    description: End your prisoner's captivity without killing them
    usage: /<command> <player>
    permission: ggvgoons.warprisoner.execute
  listprisoners:
    description: List all active war prisoners
    usage: /<command>
    permission: ggvgoons.warprisoner.list
  team:
    description: Team management commands
    usage: /<command> <join|leave|info|list|spawn|setspawn|chat> [args]
    permission: ggvgoons.team.use
  faction:
    description: Faction management commands
    usage: /<command> <create|disband|info|list|invite|kick|accept|decline|promote|demote|transfer|leave|home|sethome|chat> [args]
    aliases: [f, fac]
    permission: ggvgoons.faction.use
  fc:
    description: Faction chat shorthand
    usage: /<command> <message>
    aliases: [factionchat]
    permission: ggvgoons.faction.chat
  scoreboard:
    description: Toggle your personal scoreboard
    usage: /<command> [toggle]
    permission: ggvgoons.scoreboard.toggle
  ggadmin:
    description: Admin configuration and moderation commands
    usage: /<command> <subcommand> [args]
    aliases: [admin, ggconfig]
    permission: ggvgoons.admin.use

permissions:
  ggvgoons.warprisoner.capture:
    description: Allows capturing players as prisoners
    default: op
  ggvgoons.warprisoner.free:
    description: Allows freeing prisoners
    default: op
  ggvgoons.warprisoner.execute:
    description: Allows executing prisoners
    default: op
  ggvgoons.warprisoner.list:
    description: Allows listing all active prisoners
    default: op
  ggvgoons.team.use:
    description: Allows using basic team commands
    default: true
  ggvgoons.team.admin:
    description: Allows using team admin commands (setspawn)
    default: op
  ggvgoons.faction.use:
    description: Basic faction commands
    default: true
  ggvgoons.faction.create:
    description: Create a faction
    default: true
  ggvgoons.faction.chat:
    description: Use faction chat
    default: true
  ggvgoons.faction.home:
    description: Use faction home teleport
    default: true
  ggvgoons.faction.admin:
    description: Admin faction commands
    default: op
  ggvgoons.scoreboard.toggle:
    description: Toggle personal scoreboard
    default: true
  ggvgoons.scoreboard.admin:
    description: Admin scoreboard commands
    default: op
  ggvgoons.tablist.admin:
    description: Admin tab list commands
    default: op
  ggvgoons.admin.use:
    description: Access to admin commands
    default: op
  ggvgoons.admin.config:
    description: Modify configuration
    default: op
  ggvgoons.admin.module:
    description: Enable/disable modules
    default: op
  ggvgoons.admin.command:
    description: Manage command restrictions
    default: op
  ggvgoons.admin.permission:
    description: Manage permissions
    default: op
  ggvgoons.admin.moderate:
    description: Player moderation actions
    default: op
  ggvgoons.admin.audit:
    description: View audit logs
    default: op
  ggvgoons.admin.backup:
    description: Create and restore backups
    default: op
  ggvgoons.admin.monitor:
    description: Use monitoring tools
    default: op
  ggvgoons.admin.*:
    description: All admin permissions
    default: op
    children:
      ggvgoons.admin.config: true
      ggvgoons.admin.module: true
      ggvgoons.admin.command: true
      ggvgoons.admin.permission: true
      ggvgoons.admin.moderate: true
      ggvgoons.admin.audit: true
      ggvgoons.admin.backup: true
      ggvgoons.admin.monitor: true
  ggvgoons.admin:
    description: Full administrative access to all GGvGoons features
    default: op
    children:
      ggvgoons.warprisoner.capture: true
      ggvgoons.warprisoner.free: true
      ggvgoons.warprisoner.execute: true
      ggvgoons.warprisoner.list: true
      ggvgoons.team.admin: true
      ggvgoons.faction.admin: true
      ggvgoons.admin.*: true
