# GGvGoons Configuration

# Prisoner System Settings
prisoner:
  # How long capture offers remain valid (seconds)
  # Set to 0 to disable expiry
  offer-expiry-timeout: 60
  
  # Whether to persist prisoner state across restarts
  enable-persistence: true

# Team System Settings
teams:
  # Allow players to switch teams after joining
  allow-team-switching: true
  
  # Cooldown between team switches (seconds)
  # Set to 0 to disable cooldown
  team-switch-cooldown: 300
  
  # Team chat settings
  chat:
    enabled: true
    prefix: "[TEAM] "

# Faction System Settings
factions:
  # Enable/disable entire faction system
  enabled: true
  
  # Maximum factions per team
  max-factions-per-team: 3
  
  # Member limits
  members:
    # Default max members per faction
    default-max-members: 10
  
  # Faction homes teleport immediately; no warmup or cooldown is implemented
  homes:
    enabled: true
  
  # Faction chat
  chat:
    enabled: true
    prefix: "[FACTION] "
  
  # Invite expiry time
  invite-expiry-seconds: 60
  
  # Persistence
  enable-persistence: true

# Admin Configuration System Settings
admin:
  # Enable admin configuration system
  enabled: true
  
  # Audit logging
  audit:
    log-file: "audit.log"
    retention-days: 90
    log-player-actions: true
    log-config-changes: true
    log-mod-actions: true
  
  # Backups
  backups:
    enabled: true
    auto-backup: true
    auto-backup-interval: 3600  # seconds (1 hour)
    max-backups: 10
  
  # Command restrictions
  commands:
    allow-admin-bypass: true
    custom-disable-message: "&cThis command is currently disabled."
  
  # Permissions
  permissions:
    # Bukkit grants work for online players only. If true and LuckPerms is installed,
    # edit requests report unsupported instead of pretending to change LuckPerms.
    use-luckperms: false

# Scoreboard & Tab List System
scoreboard:
  enabled: true
  title: "&6&lGG vs Goons"
  update-interval: 20
  elements:
    server-name: true
    team: true
    faction: true
    kills: true
    deaths: true
    kdr: true
    prisoners-captured: true
    player-status: true
    online-players: true
    team-online: true
    team-prisoners: true
    tps: false
    current-time: false
  labels:
    team: "&eTeam:"
    faction: "&eFaction:"
    kills: "&eKills:"
    deaths: "&eDeaths:"
    kdr: "&eK/D:"
    prisoners: "&ePrisoners:"
    status: "&eStatus:"
    online: "&eOnline:"
    team-online: "&eTeam Online:"
    team-prisoners: "&eTeam Prisoners:"
  colors:
    title: "&6&l"
    labels: "&e"
    values: "&f"
    team-gg: "&6"
    team-goons: "&1"
    positive: "&a"
    negative: "&c"
    neutral: "&7"
  conditions:
    enabled-worlds: []
    hide-in-combat: false
    hide-when-prisoner: false

tablist:
  enabled: true
  separate-by-team: true  # Shows fixed team headings; does not reorder tab entries
  header: |-
    &6&l━━━━━━━━━━━━━━━━━━━━━━━━
    &6&lGG vs Goons Server
    &7Online: &f{online}/{max}
    &6&l━━━━━━━━━━━━━━━━━━━━━━━━
  footer: |-
    &6&l━━━━━━━━━━━━━━━━━━━━━━━━
    &7TPS: &f{tps}
    &7Website: &fggvsgoons.com
    &6&l━━━━━━━━━━━━━━━━━━━━━━━━
  team-headers:
    gg: "&6&l▬▬▬▬ GG Team ▬▬▬▬"
    goons: "&1&l▬▬▬▬ Goons Team ▬▬▬▬"
    none: "&7&l▬▬▬▬ No Team ▬▬▬▬"
  player-format:
    show-faction-tags: true
    faction-tag-format: "&7[{faction}] "
    show-status-indicators: true
    status-indicators:
      prisoner: "&c⛓ "
      frozen: "&b❄ "
      leader: "&6★ "
      officer: "&e⚑ "
    team-colors:
      gg: "&6"
      goons: "&1"
      none: "&7"
  ping:
    show-ping: true
    format: " &7({ping}ms)"
    colors:
      excellent: "&a"
      good: "&e"
      fair: "&6"
      poor: "&c"
